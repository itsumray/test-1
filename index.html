    const iconStyle = 'minimal-monochrome';
    let currentLang = 'en';

    function detectKeyFromUrl(url) {
      if (!url) return 'website';
      const clean = url.trim().toLowerCase();
      if (clean.includes('youtube.com') || clean.includes('youtu.be')) return 'youtube';
      if (clean.includes('twitter.com') || clean.includes('x.com')) return 'x';
      if (clean.includes('github.com')) return 'github';
      if (clean.includes('instagram.com')) return 'instagram';
      if (clean.includes('linkedin.com')) return 'linkedin';
      if (clean.includes('spotify.com')) return 'spotify';
      if (clean.includes('tiktok.com')) return 'tiktok';
      if (clean.includes('twitch.tv')) return 'twitch';
      if (clean.includes('discord.')) return 'discord';
      if (clean.includes('substack.com')) return 'substack';
      if (clean.includes('medium.com')) return 'medium';
      if (clean.includes('producthunt.com')) return 'producthunt';
      if (clean.includes('buymeacoffee.com')) return 'buymeacoffee';
      if (clean.includes('etsy.com')) return 'etsy';
      if (clean.includes('wa.me') || clean.includes('whatsapp.com')) return 'whatsapp';
      if (clean.includes('t.me') || clean.includes('telegram.')) return 'telegram';
      if (clean.startsWith('mailto:')) return 'email';
      if (clean.startsWith('tel:')) return 'phone';
      return 'website';
    }

    function getIconForUrl(url, thumbnail) {
      if (thumbnail) {
        return `<img src="${thumbnail}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;" alt="" />`;
      }
      const key = detectKeyFromUrl(url);
      const svg = svgMap[key] || svgMap['website'];
      return svg;
    }

    function getTrans(transObj, fallback, lang) {
      if (transObj && transObj[lang] && transObj[lang].trim().length > 0) {
        return transObj[lang];
      }
      return fallback || '';
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === lang.toUpperCase());
      });

      const bioEl = document.getElementById('profileBio');
      if (bioEl) bioEl.innerText = getTrans(profileData.bioTranslations, profileData.bio, lang);

      const locEl = document.getElementById('profileLocation');
      if (locEl) locEl.innerText = '📍 ' + getTrans(profileData.locationTranslations, profileData.location, lang);

      renderLinks();
    }

    function renderLinks() {
      const container = document.getElementById('linksContainer');
      if (!container) return;

      container.innerHTML = linksData.map(link => {
        const title = getTrans(link.titleTranslations, link.title, currentLang);
        const desc = getTrans(link.descriptionTranslations, link.description, currentLang);
        const badge = getTrans(link.badgeTextTranslations, link.badgeText, currentLang);

        const badgeHtml = badge ? `<span style="font-size: 10px; font-weight: 800; background: #fbbf24; color: #000; padding: 2px 8px; border-radius: 9999px; text-transform: uppercase;">${badge}</span>` : '';
        const descHtml = desc ? `<p style="font-size: 12px; color: #94a3b8; margin-top: 4px; line-height: 1.4;">${desc}</p>` : '';

        const iconHtml = getIconForUrl(link.url, link.thumbnail);

        return `
          <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="link-card">
            <div style="display: flex; items-center; justify-content: space-between; gap: 8px;">
              <div style="display: flex; align-items: center; gap: 12px;">

                <div style="text-align: left;">
                  <h3 style="font-weight: 700; font-size: 15px; color: #ffffff; margin: 0;">${title}</h3>
                  ${descHtml}
                </div>
              </div>
              ${badgeHtml}
            </div>
          </a>
        `;
      }).join('');
    }

    renderLinks();
